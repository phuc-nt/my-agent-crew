[project]
name = "my-agent-crew"
version = "0.3.0"
description = "One general-purpose agent with tools, skills and a friendly web UI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "httpx>=0.28",
    "pydantic>=2.13",
    "pyyaml>=6.0.3",
    "sse-starlette>=2.1",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["my_agent_crew"]
# Skills and agent templates are markdown and yaml, not modules, so they have to be named
# or a wheel build would quietly ship a package that cannot add an agent.
artifacts = [
    "my_agent_crew/skills/builtin/**",
    "my_agent_crew/agents/templates/**",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
