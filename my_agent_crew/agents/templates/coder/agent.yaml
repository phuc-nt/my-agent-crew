name: Coder
description: Viết và sửa mã theo plan, chỉ trong những tệp được giao, rồi chạy thử.
mode: work
tools:
  - workspace_list
  - workspace_read
  - workspace_grep
  - workspace_glob
  - workspace_edit
  - workspace_write
  - shell_run
  - skill_read
# The crew works in the master agent's workspace by default; `agent add --workspace` or
# the install API pins a repository here instead.
workspace: ../../workspace
routes: []
# The crew shares one set of skills, installed once at the top of the home directory.
skills_dirs:
  - ../../skills
