name: Tester
description: Chọn test theo diff, viết test còn thiếu, chạy suite và báo pass/fail.
mode: work
# Writes tests, never source: which paths that means is a rule in the persona.
tools:
  - workspace_list
  - workspace_read
  - workspace_grep
  - workspace_glob
  - workspace_edit
  - workspace_write
  - shell_run
  - skill_read
# The crew works in the master agent's workspace by default; `agent add --workspace` or
# the install API pins a repository here instead.
workspace: ../../workspace
routes: []
# The crew shares one set of skills, installed once at the top of the home directory.
skills_dirs:
  - ../../skills
